<div class="container mt-4" style="max-width:640px">
  <a routerLink="/sections" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back</a>
  @if (item) {
    <div class="card mb-3">
      <div class="card-header"><h5 class="mb-0">Section: {{ item.sname }}</h5></div>
      <div class="card-body">
        <dl class="row mb-0">
          <dt class="col-4">Name</dt><dd class="col-8">{{ item.sname }}</dd>
          <dt class="col-4">Department</dt><dd class="col-8">{{ item.department }}</dd>
        </dl>
      </div>
    </div>
    <h6>Products in this section</h6>
    <div class="table-responsive rounded-3 border shadow-sm">
    <table class="table table-sm table-hover align-middle mb-0">
      <thead class="table-dark"><tr><th>#</th><th>Name</th><th>Brand</th><th>Price</th></tr></thead>
      <tbody>
        @for (p of products; track p.prodid) {
          <tr class="clickable-row" [routerLink]="['/products', p.prodid]">
            <td>{{ p.prodid }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.brand }}</td>
            <td>{{ p.price | number:'1.2-2' }} €</td>
          </tr>
        }
        @empty { <tr><td colspan="4" class="text-muted text-center">No products in this section.</td></tr> }
      </tbody>
    </table>
    </div>
  }
</div>
