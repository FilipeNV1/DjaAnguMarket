<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Sections</h2>
    @if (canWrite) { <a routerLink="/sections/new" class="btn btn-dark">+ Add</a> }
  </div>
  @if (loading) { <p class="text-muted">Loading sections...</p> }
  @if (error) {
    <div class="alert alert-warning">
      {{ error }}
      <button type="button" class="btn btn-sm btn-outline-dark ms-2" (click)="load()">Retry</button>
    </div>
  }
  <input class="form-control mb-3" placeholder="Search..." [(ngModel)]="search" (input)="applyFilter()" />
  <div class="table-responsive rounded-3 border shadow-sm">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-dark"><tr><th>Name</th><th>Department</th><th>Actions</th></tr></thead>
    <tbody>
      @for (s of filtered; track s.sname) {
        <tr class="clickable-row" [routerLink]="['/sections', s.sname]">
          <td>{{ s.sname }}</td>
          <td>{{ s.department }}</td>
          <td (click)="$event.stopPropagation()">
            @if (canWrite) {
              <a [routerLink]="['/sections', s.sname, 'edit']" class="btn btn-sm btn-outline-secondary me-1">Edit</a>
              <button class="btn btn-sm btn-outline-danger" (click)="delete(s.sname)">Delete</button>
            }
          </td>
        </tr>
      }
      @empty {
        @if (!loading && !error) {
          <tr><td colspan="3" class="text-center text-muted">No sections found.</td></tr>
        }
      }
    </tbody>
  </table>
  </div>
</div>
