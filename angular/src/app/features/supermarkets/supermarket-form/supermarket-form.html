<div class="container mt-4" style="max-width:560px">
  <a routerLink="/supermarkets" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back</a>
  <div class="card">
    <div class="card-header"><h5 class="mb-0">{{ isEditing ? 'Edit' : 'New' }} Supermarket</h5></div>
    <div class="card-body">
      @if (error) { <div class="alert alert-danger">{{ error }}</div> }
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Location *</label>
          <input class="form-control" formControlName="location" />
        </div>
        <div class="mb-3">
          <label class="form-label">Opening Time *</label>
          <input class="form-control" type="time" formControlName="opening_time" />
        </div>
        <div class="mb-3">
          <label class="form-label">Close Time *</label>
          <input class="form-control" type="time" formControlName="close_time" />
        </div>
        <div class="mb-3">
          <label class="form-label">Sections</label>
          <div class="d-flex flex-wrap gap-2">
            @for (s of sections; track s.sname) {
              <button type="button" class="btn btn-sm"
                [class.btn-dark]="isSelected(s.sname)"
                [class.btn-outline-secondary]="!isSelected(s.sname)"
                (click)="toggleSection(s.sname)">
                {{ s.sname }}
              </button>
            }
          </div>
        </div>
        <button class="btn btn-dark w-100" type="submit">{{ isEditing ? 'Save' : 'Create' }}</button>
      </form>
    </div>
  </div>
</div>
