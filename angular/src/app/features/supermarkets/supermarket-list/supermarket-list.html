<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Supermarkets</h2>
    @if (canWrite) {
      <a routerLink="/supermarkets/new" class="btn btn-dark">+ Add</a>
    }
  </div>
  <input class="form-control mb-3" placeholder="Search by location..." [(ngModel)]="search" (input)="applyFilter()" />
  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>#</th><th>Location</th><th>Opening</th><th>Close</th><th>Sections</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (s of filtered; track s.id) {
        <tr>
          <td>{{ s.id }}</td>
          <td><a [routerLink]="['/supermarkets', s.id]">{{ s.location }}</a></td>
          <td>{{ s.opening_time }}</td>
          <td>{{ s.close_time }}</td>
          <td>{{ s.sections?.length ?? 0 }}</td>
          <td>
            @if (canWrite) {
              <a [routerLink]="['/supermarkets', s.id, 'edit']" class="btn btn-sm btn-outline-secondary me-1">Edit</a>
              <button class="btn btn-sm btn-outline-danger" (click)="delete(s.id)">Delete</button>
            }
          </td>
        </tr>
      }
      @empty {
        <tr><td colspan="6" class="text-center text-muted">No supermarkets found.</td></tr>
      }
    </tbody>
  </table>
</div>
