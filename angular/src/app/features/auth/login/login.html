<div class="row justify-content-center align-items-center min-vh-75 mt-4">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card border-0 shadow-lg login-card">
      <div class="card-body p-5">

        <div class="text-center mb-5">
          <i class="bi bi-cart-fill" style="font-size: 3rem; color: #8bda4b"></i>
          <h2 class="card-title mt-3 fw-bold">DjanGoMarket</h2>
          <p class="text-muted">Sign in to your account</p>
        </div>

        @if (error) {
          <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i>
            <strong>Login Failed</strong>
            <div>{{ error }}</div>
          </div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">Employee Number</label>
            <input class="form-control" type="number" formControlName="enumber" placeholder="Enter your employee number" />
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input class="form-control" type="password" formControlName="password" placeholder="Enter your password" />
          </div>
          <button class="btn btn-success w-100 fw-semibold py-2 mb-3" type="submit">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>

        <hr class="my-4" />

        <div class="alert alert-info text-center small text-muted mb-0">
          <i class="bi bi-info-circle me-2"></i>
          Demo: employee <strong>1000</strong> / password <strong>password123</strong>
        </div>

      </div>
    </div>
  </div>
</div>
