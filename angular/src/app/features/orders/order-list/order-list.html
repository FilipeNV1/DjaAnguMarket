<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Orders</h2>
    @if (canWrite) { <a routerLink="/orders/new" class="btn btn-dark">+ Add</a> }
  </div>
  <input class="form-control mb-3" placeholder="Search by date or distributor..." [(ngModel)]="search" (input)="applyFilter()" />
  <table class="table table-bordered table-hover">
    <thead class="table-dark"><tr><th>#</th><th>Date</th><th>Distributor</th><th>Total</th><th>Actions</th></tr></thead>
    <tbody>
      @for (o of filtered; track o.orderid) {
        <tr>
          <td>{{ o.orderid }}</td>
          <td><a [routerLink]="['/orders', o.orderid]">{{ o.ord_date }}</a></td>
          <td>{{ o.distributor_name ?? o.distributor }}</td>
          <td>{{ o.calculated_total | number:'1.2-2' }} €</td>
          <td>
            @if (canWrite) {
              <a [routerLink]="['/orders', o.orderid, 'edit']" class="btn btn-sm btn-outline-secondary me-1">Edit</a>
              <button class="btn btn-sm btn-outline-danger" (click)="delete(o.orderid)">Delete</button>
            }
          </td>
        </tr>
      }
      @empty { <tr><td colspan="5" class="text-center text-muted">No orders found.</td></tr> }
    </tbody>
  </table>
</div>
