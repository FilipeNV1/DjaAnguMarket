<div class="container mt-4" style="max-width:500px">
  <a routerLink="/distributors" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back</a>
  @if (item) {
    <div class="card">
      <div class="card-header"><h5 class="mb-0">{{ item.name }}</h5></div>
      <div class="card-body">
        <dl class="row mb-0">
          <dt class="col-4">Email</dt><dd class="col-8">{{ item.email }}</dd>
          <dt class="col-4">Contact</dt><dd class="col-8">{{ item.contact }}</dd>
        </dl>
      </div>
    </div>
  }
</div>
