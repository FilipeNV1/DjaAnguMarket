<div class="container mt-4">
  @if (item) {
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
      <div>
        <nav aria-label="breadcrumb" class="mb-1">
          <ol class="breadcrumb mb-0 small">
            <li class="breadcrumb-item"><a routerLink="/clients" class="text-decoration-none">Clients</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ item.name }}</li>
          </ol>
        </nav>
        <h2 class="fw-bold mb-0 text-dark">
          <i class="bi bi-person-badge text-muted me-2" style="font-size: 1.5rem;"></i>{{ item.name }}
        </h2>
      </div>
      <a routerLink="/clients" class="btn btn-outline-secondary rounded-pill px-3 fw-medium">
        <i class="bi bi-arrow-left me-1"></i>All clients
      </a>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="h6 text-uppercase text-muted fw-semibold mb-3">Details</h3>
        <dl class="row mb-0 small">
          <dt class="col-4 text-muted fw-normal">Name</dt>
          <dd class="col-8 mb-2 fw-semibold text-dark">{{ item.name }}</dd>
          <dt class="col-4 text-muted fw-normal">NIF</dt>
          <dd class="col-8 mb-2">{{ item.nif }}</dd>
          <dt class="col-4 text-muted fw-normal">Fidelity</dt>
          <dd class="col-8 mb-2">{{ item.fidelity }}</dd>
          <dt class="col-4 text-muted fw-normal">Address</dt>
          <dd class="col-8 mb-2">{{ item.address }}</dd>
          <dt class="col-4 text-muted fw-normal">Contact</dt>
          <dd class="col-8 mb-2">{{ item.contact }}</dd>
        </dl>
      </div>
    </div>
  }
</div>
