<div class="container mt-4" style="max-width:600px">
  <a routerLink="/employees" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back</a>
  <div class="card">
    <div class="card-header"><h5 class="mb-0">{{ isEditing ? 'Edit' : 'New' }} Employee</h5></div>
    <div class="card-body">
      @if (error) { <div class="alert alert-danger">{{ error }}</div> }
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Name *</label>
            <input class="form-control" formControlName="name" />
          </div>
          <div class="col-6">
            <label class="form-label">Role *</label>
            <input class="form-control" formControlName="role" />
          </div>
          <div class="col-6">
            <label class="form-label">Group</label>
            <select class="form-select" formControlName="group_name">
              @for (g of groups; track g) { <option [value]="g">{{ g }}</option> }
            </select>
          </div>
          <div class="col-6">
            <label class="form-label">Salary (€) *</label>
            <input class="form-control" type="number" step="0.01" formControlName="salary" />
          </div>
          <div class="col-6">
            <label class="form-label">Age *</label>
            <input class="form-control" type="number" formControlName="age" />
          </div>
          <div class="col-6">
            <label class="form-label">Contact *</label>
            <input class="form-control" formControlName="contact" />
          </div>
          <div class="col-6">
            <label class="form-label">Sex</label>
            <select class="form-select" formControlName="sex">
              <option value="M">Male</option>
              <option value="F">Female</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Supermarket *</label>
            <select class="form-select" formControlName="supermarket">
              <option [value]="null" disabled>-- select --</option>
              @for (s of supermarkets; track s.id) { <option [value]="s.id">{{ s.location }}</option> }
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Supervisor</label>
            <select class="form-select" formControlName="supervisor">
              <option [value]="null">- None -</option>
              @for (e of employees; track e.enumber) { <option [value]="e.enumber">{{ e.name }} (#{{ e.enumber }})</option> }
            </select>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="is_active" id="isActive" />
              <label class="form-check-label" for="isActive">Active</label>
            </div>
          </div>
        </div>
        <button class="btn btn-dark w-100 mt-3" type="submit">{{ isEditing ? 'Save' : 'Create' }}</button>
      </form>
    </div>
  </div>
</div>
