<div class="container mt-4">
  @if (item) {
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
      <div>
        <nav aria-label="breadcrumb" class="mb-1">
          <ol class="breadcrumb mb-0 small">
            <li class="breadcrumb-item"><a routerLink="/products" class="text-decoration-none">Products</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ item.name }}</li>
          </ol>
        </nav>
        <h2 class="fw-bold mb-0 text-dark">
          <i class="bi bi-box-seam text-muted me-2" style="font-size: 1.5rem;"></i>{{ item.name }}
        </h2>
      </div>
      <a routerLink="/products" class="btn btn-outline-secondary rounded-pill px-3 fw-medium">
        <i class="bi bi-arrow-left me-1"></i>All products
      </a>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="h6 text-uppercase text-muted fw-semibold mb-3">Details</h3>
        <dl class="row mb-0 small">
          <dt class="col-4 text-muted fw-normal">Brand</dt>
          <dd class="col-8 mb-2 fw-semibold text-dark">{{ item.brand }}</dd>
          <dt class="col-4 text-muted fw-normal">Price</dt>
          <dd class="col-8 mb-2">{{ item.price | number:'1.2-2' }} €</dd>
          <dt class="col-4 text-muted fw-normal">Section</dt>
          <dd class="col-8 mb-2">
            <a [routerLink]="['/sections', sectionName]">{{ item.section ?? item.section_name }}</a>
          </dd>
          <dt class="col-4 text-muted fw-normal">Requires Cold</dt>
          <dd class="col-8 mb-2">{{ item.req_cold ? 'Yes' : 'No' }}</dd>
        </dl>
      </div>
    </div>
  }
</div>
