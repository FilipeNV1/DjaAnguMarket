<div class="container mt-4" style="max-width:500px">
  <a routerLink="/products" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back</a>
  <div class="card">
    <div class="card-header"><h5 class="mb-0">{{ isEditing ? 'Edit' : 'New' }} Product</h5></div>
    <div class="card-body">
      @if (error) { <div class="alert alert-danger">{{ error }}</div> }
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Name *</label>
          <input class="form-control" formControlName="name" />
        </div>
        <div class="mb-3">
          <label class="form-label">Brand *</label>
          <input class="form-control" formControlName="brand" />
        </div>
        <div class="mb-3">
          <label class="form-label">Price (€) *</label>
          <input class="form-control" type="number" step="0.01" formControlName="price" />
        </div>
        <div class="mb-3">
          <label class="form-label">Section *</label>
          <select class="form-select" formControlName="section_name">
            <option value="" disabled>-- select --</option>
            @for (s of sections; track s.sname) { <option [value]="s.sname">{{ s.sname }}</option> }
          </select>
        </div>
        <div class="mb-3 form-check">
          <input class="form-check-input" type="checkbox" formControlName="req_cold" id="reqCold" />
          <label class="form-check-label" for="reqCold">Requires Cold Storage</label>
        </div>
        <button class="btn btn-dark w-100" type="submit">{{ isEditing ? 'Save' : 'Create' }}</button>
      </form>
    </div>
  </div>
</div>
