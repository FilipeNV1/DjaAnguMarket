<nav class="navbar navbar-expand-lg navbar-dark dm-navbar">
  <div class="container">
    <a class="navbar-brand" routerLink="/"><i class="bi bi-cart-fill me-3" style="color: #8bda4b"></i>DjanGoMarket</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        @for (item of menuItems; track item.link) {
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="user ? item.link : '/login'"
              [queryParams]="user ? null : { next: item.link }"
              routerLinkActive="active"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>

      @if (user) {
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item">
            <a routerLink="/profile" routerLinkActive="active" class="nav-link text-light text-decoration-none me-2" style="font-size: 0.8rem; white-space: nowrap;">
              <i class="bi bi-person-circle me-1"></i>{{ user.name }} <span class="badge text-bg-light text-dark">{{ user.group }}</span>
            </a>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm" (click)="logout()">Logout</button>
          </li>
        </ul>
      }
    </div>
  </div>
</nav>
