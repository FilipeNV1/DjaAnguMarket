<nav class="navbar navbar-expand-lg navbar-dark dm-navbar">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/"><i class="bi bi-cart-fill me-3" style="color: #8bda4b"></i>DjanGoMarket</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        @for (item of menuItems; track item.link) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="item.link" routerLinkActive="active">{{ item.label }}</a>
          </li>
        }
      </ul>

      @if (user) {
        <a routerLink="/profile" routerLinkActive="active" class="navbar-text me-3 text-light text-decoration-none">
          <i class="bi bi-person-circle me-1"></i>{{ user.name }} <span class="badge text-bg-light text-dark">{{ user.group }}</span>
        </a>
        <button class="btn btn-outline-light btn-sm" (click)="logout()">Logout</button>
      }
    </div>
  </div>
</nav>
