<nav class="navbar navbar-expand-lg navbar-dark dm-navbar">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">DjanGoMarket</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        @for (item of menuItems; track item.link) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="item.link" routerLinkActive="active">{{ item.label }}</a>
          </li>
        }
      </ul>
      @if (user) {
        <span class="navbar-text me-3 text-light">
          {{ user.name }} <span class="badge text-bg-light text-dark">{{ user.group }}</span>
        </span>
        <button class="btn btn-outline-light btn-sm" (click)="logout()">Logout</button>
      }
    </div>
  </div>
</nav>
